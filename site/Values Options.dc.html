<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&amp;family=Bebas+Neue&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#e9e4da;font-family:'Source Sans 3',sans-serif;color:#1d2f52}a{color:#c2332b}a:hover{color:#1d2f52}</style>
</helmet>
<section style="padding: 48px; display: flex; flex-direction: column; gap: 24px;">
  <h1 style="font-family: 'Alfa Slab One', serif; font-weight: 400; font-size: 28px; margin: 0;">Values section — three ideas</h1>
  <div style="display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start;">

    <div id="1a" style="width: 920px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; gap: 12px; align-items: center;"><span style="background: #1d2f52; color: #fff; font-weight: 700; padding: 4px 10px;">1a</span><strong>Card grid — 3 × 2 boxes</strong></div>
      <div style="background: #fff; padding: 56px; border: 3px double #1d2f52;">
        <h2 style="font-family: 'Alfa Slab One', serif; font-weight: 400; font-size: 42px; line-height: 1.1; margin: 0 0 32px;">Values</h2>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px;">
          <sc-for list="{{ values }}" as="v" hint-placeholder-count="6">
            <div style="background: #fbf6ec; border: 3px double #1d2f52; padding: 22px; display: flex; flex-direction: column; gap: 10px;">
              <span style="font-family: 'Bebas Neue', sans-serif; font-size: 44px; line-height: 1; color: #c2332b;">{{ v.n }}</span>
              <h3 style="font-family: 'Alfa Slab One', serif; font-weight: 400; font-size: 19px; line-height: 1.2; margin: 0;">{{ v.t }}</h3>
              <p style="font-size: 15px; line-height: 1.55; margin: 0;">{{ v.d }}</p>
            </div>
          </sc-for>
        </div>
      </div>
    </div>

    <div id="1b" style="width: 920px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; gap: 12px; align-items: center;"><span style="background: #1d2f52; color: #fff; font-weight: 700; padding: 4px 10px;">1b</span><strong>Navy band — two columns, cream text</strong></div>
      <div style="background: #1d2f52; color: #f4ecdc; padding: 56px;">
        <h2 style="font-family: 'Alfa Slab One', serif; font-weight: 400; font-size: 42px; line-height: 1.1; margin: 0 0 8px;">Values</h2>
        <div style="width: 64px; height: 4px; background: #c2332b; margin-bottom: 32px;"></div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 48px;">
          <sc-for list="{{ values }}" as="v" hint-placeholder-count="6">
            <div style="display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 14px; padding: 22px 0; border-top: 1px solid rgba(244,236,220,0.35);">
              <span style="font-family: 'Bebas Neue', sans-serif; font-size: 48px; line-height: 1; color: #f08a80;">{{ v.n }}</span>
              <div><h3 style="font-family: 'Alfa Slab One', serif; font-weight: 400; font-size: 19px; line-height: 1.2; margin: 2px 0 8px; color: #fff;">{{ v.t }}</h3><p style="font-size: 15px; line-height: 1.55; margin: 0;">{{ v.d }}</p></div>
            </div>
          </sc-for>
        </div>
      </div>
    </div>

    <div id="1c" style="width: 920px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; gap: 12px; align-items: center;"><span style="background: #1d2f52; color: #fff; font-weight: 700; padding: 4px 10px;">1c</span><strong>Big words — value name large on the left, text on the right</strong></div>
      <div style="background: #fff; padding: 56px; border: 3px double #1d2f52;">
        <h2 style="font-family: 'Alfa Slab One', serif; font-weight: 400; font-size: 42px; line-height: 1.1; margin: 0 0 24px;">Values</h2>
        <sc-for list="{{ values }}" as="v" hint-placeholder-count="6">
          <div style="display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 32px; align-items: center; padding: 22px 0; border-top: 3px solid #c2332b;">
            <div style="display: flex; gap: 16px; align-items: baseline;"><span style="font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: #c2332b;">{{ v.n }}</span><h3 style="font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 40px; line-height: 1; letter-spacing: 0.02em; margin: 0;">{{ v.t }}</h3></div>
            <p style="font-size: 16px; line-height: 1.6; margin: 0;">{{ v.d }}</p>
          </div>
        </sc-for>
      </div>
    </div>

  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const v = [
      ["We're Honest", 'We hope to make relationships for life. We want to be your trusted partner and value our reputation that we stand on.'],
      ['Fair Economical Upfront Pricing', 'You get a written proposal with clear pricing before any work starts. No pressure, no surprise line items.'],
      ['We do Things Right the First Time', "Cutting corners doesn't pay off in the long run so we do it the right way every time to ensure quality."],
      ['Integrity', "We do what we say we are going to do and do the right thing because that's the way we believe good businesses operate."],
      ['Local to Spring', 'We live and work here. We know how Gulf Coast clay moves through wet springs and dry summers in Spring, Klein and the neighborhoods around them.'],
      ['We Pride Ourselves on Communication', 'We communicate frequently so you know what to expect and feel comfortable with our process.']
    ];
    return { values: v.map(([t, d], i) => ({ n: '0' + (i + 1), t, d })) };
  }
}
</script>
</body>
</html>
