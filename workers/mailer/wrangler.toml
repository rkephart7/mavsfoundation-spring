# Deployed by Cloudflare Workers Builds from this folder (root directory: workers/mailer).
name = "mavs-mailer"
main = "index.js"
compatibility_date = "2025-09-01"
# No public URL: only the site reaches it, through the MAILER service binding.
workers_dev = false
# Keep the variables set in the dashboard (MAIL_TO, RENTER_EMAIL, ...) when this deploys.
keep_vars = true
preview_urls = false

send_email = [{ name = "SEND" }]

[vars]
FROM = "leads@mavsofspringtxfoundationrepair.com"
FROM_NAME = "Mavericks Website Leads"
SITE = "https://mavsofspringtxfoundationrepair.com"

# Monthly report: 14:00 UTC on the 1st (8 or 9 AM Central).
[triggers]
crons = ["0 14 1 * *"]
